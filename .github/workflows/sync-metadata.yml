name: Sync bibliography and Sider import records

on:
  push:
    branches: [main]
    paths:
      - 'metadata/papers.json'
      - 'metadata/sider_import_events.jsonl'
      - 'scripts/sync_metadata.py'
      - 'scripts/audit_bibliography.py'
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'

permissions:
  contents: write

concurrency:
  group: research-metadata-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate inputs and regenerate public CSV files
        run: python3 scripts/sync_metadata.py
      - name: Commit metadata changes, if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/papers.csv metadata/sider_imports.csv metadata/quality_report.md
          if git diff --cached --quiet; then
            echo "Metadata is already synchronized."
            exit 0
          fi
          git commit -m "Sync bibliography and Sider import CSVs"
          git pull --rebase origin main
          git push origin HEAD:main
