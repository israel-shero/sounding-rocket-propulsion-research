name: Collect open-access research PDFs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'

permissions:
  contents: write

concurrency:
  group: research-metadata-writes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Run every other day (manual runs always proceed)
        id: cadence
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime, os
          today = datetime.datetime.now(datetime.timezone.utc).date()
          anchor = datetime.date(2026, 11, 22)
          proceed = os.environ["EVENT_NAME"] == "workflow_dispatch" or (today - anchor).days % 2 == 0
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"proceed={'true' if proceed else 'false'}\n")
          print("Download run enabled:", proceed)
          PY
      - uses: actions/checkout@v4
        if: steps.cadence.outputs.proceed == 'true'
        with:
          fetch-depth: 0
      - name: Install PDF structure validator
        if: steps.cadence.outputs.proceed == 'true'
        run: python3 -m pip install 'pypdf>=5,<8'
      - name: Retrieve publicly accessible candidate PDFs
        if: steps.cadence.outputs.proceed == 'true'
        run: python3 scripts/download_pdfs.py
      - name: Regenerate bibliography and Sider import CSV files
        if: steps.cadence.outputs.proceed == 'true'
        run: python3 scripts/sync_metadata.py
      - name: Upload PDF bundle and download log
        if: steps.cadence.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: research-pdfs-${{ github.run_number }}
          path: |
            pdfs/
            metadata/download_results.csv
          if-no-files-found: warn
          retention-days: 30
      - name: Commit PDF download log and metadata updates
        if: steps.cadence.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/download_results.csv metadata/papers.csv metadata/sider_imports.csv metadata/quality_report.md
          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
            exit 0
          fi
          git commit -m "Update PDF collection results and research metadata"
          git pull --rebase origin main
          git push origin HEAD:main
